name: Auto Extract
on:
  push:
    paths:
      - "*.zip"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find and unzip
        run: |
          ls -la
          ZIP=$(ls *.zip 2>/dev/null | head -1)
          if [ -z "$ZIP" ]; then
            echo "no zip found"
            exit 0
          fi
          echo "found: $ZIP"
          mkdir -p extracted
          unzip -o "$ZIP" -d extracted/
      - name: Flatten
        run: |
          cd extracted
          if [ "$(ls -A | wc -l)" -eq 1 ] && [ -d "$(ls -A)" ]; then
            mv "$(ls -A)"/* .
          fi
          cd ..
      - name: Sync
        run: |
          cp -rn extracted/* . || true
          rm -rf extracted *.zip
      - name: Commit
        run: |
          git config user.name bot
          git config user.email bot@bot.com
          git add -A
          git commit -m extract || echo nothing
          git push
