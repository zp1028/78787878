name: Auto Extract
on:
  push:
    paths:
      - uploads/*.zip
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract
        run: |
          mkdir -p extracted
          for f in uploads/*.zip; do
            unzip -o "$f" -d extracted/
          done
      - name: Flatten
        run: |
          cd extracted
          if [ "$(ls -A | wc -l)" -eq 1 ] && [ -d "$(ls -A)" ]; then
            mv "$(ls -A)"/* .
          fi
          cd ..
      - name: Sync
        run: |
          cp -rn extracted/* . || true
          rm -rf extracted uploads
      - name: Commit
        run: |
          git config user.name bot
          git config user.email bot@bot.com
          git add -A
          git commit -m extract || echo nothing
          git push
